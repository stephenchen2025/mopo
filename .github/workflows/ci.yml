name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -U pip black
      - name: Format check
        run: python -m black --check -l 120 .

  smoke:
    # The synthetic experiment is the project's actual validation, so a short run of it
    # gates the repo too. A full grid is ~12 minutes; this is a few seconds and catches
    # the breakages that unit tests miss -- shape errors in the training loop, a method
    # registry entry that no longer resolves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]' pyyaml
      - name: Synthetic experiment smoke run
        run: python experiments/synthetic_frontier.py --seeds 2 --steps 60 --workers 2 --output /tmp/smoke.json
      - name: Config dry-run
        run: python scripts/train_llm.py --config configs/gemma4_e4b.yaml --dry-run > /dev/null
